name: Experimental Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  plan-release:
    name: Plan semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_required: ${{ steps.plan.outputs.release_required }}
      current_version: ${{ steps.plan.outputs.current_version }}
      release_type: ${{ steps.plan.outputs.release_type }}
      next_version: ${{ steps.plan.outputs.next_version }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan release from Conventional Commits
        id: plan
        shell: bash
        run: bash ./scripts/plan-release.sh >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build and test experimental macOS release
    needs: plan-release
    if: needs.plan-release.outputs.release_required == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --dir frontend --frozen-lockfile

      - name: Build frontend assets
        run: pnpm --dir frontend run build

      - name: Run backend tests
        run: go test ./...

      - name: Run frontend tests
        run: pnpm --dir frontend run test

      - name: Build release artifact
        run: bash ./scripts/package-darwin-release.sh "${{ needs.plan-release.outputs.next_version }}"

      - name: Archive app bundle for protected signing
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/ssh-man.app \
            dist/ssh-man-app.zip

      - name: Upload app bundle for protected signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh-man-app-${{ needs.plan-release.outputs.next_version }}
          path: dist/ssh-man-app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Build experimental and stable Windows installers
    needs: plan-release
    if: needs.plan-release.outputs.release_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Windows cross-compilation and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64 nsis

      - name: Build Windows release artifacts
        shell: bash
        run: bash ./scripts/package-windows-release.sh "${{ needs.plan-release.outputs.next_version }}"

      - name: Render stable and experimental WinGet manifests
        shell: bash
        env:
          VERSION: ${{ needs.plan-release.outputs.next_version }}
        run: |
          set -euo pipefail
          STABLE_SHA="$(
            sha256sum dist/ssh-man-windows-amd64-installer.exe |
              awk '{print $1}'
          )"
          EXPERIMENTAL_SHA="$(
            sha256sum dist/ssh-man-experimental-windows-amd64-installer.exe |
              awk '{print $1}'
          )"
          ruby ./scripts/render-winget-manifests.rb \
            stable \
            "$VERSION" \
            "$STABLE_SHA" \
            dist/winget/stable
          ruby ./scripts/render-winget-manifests.rb \
            experimental \
            "$VERSION" \
            "$EXPERIMENTAL_SHA" \
            dist/winget/experimental

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh-man-windows-${{ needs.plan-release.outputs.next_version }}
          path: |
            dist/ssh-man-windows-amd64-installer.exe
            dist/ssh-man-experimental-windows-amd64-installer.exe
            dist/winget
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  test-windows-installers:
    name: Test Windows installer lifecycle
    needs:
      - plan-release
      - build-windows
    if: needs.plan-release.outputs.release_required == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ssh-man-windows-${{ needs.plan-release.outputs.next_version }}
          path: dist

      - name: Exercise install, running upgrade, and uninstall
        shell: pwsh
        run: |
          pwsh ./scripts/test-windows-installer-lifecycle.ps1 `
            -Version '${{ needs.plan-release.outputs.next_version }}' `
            -ArtifactsDirectory ./dist

  publish-release:
    name: Sign, notarize, and publish experimental release
    needs:
      - plan-release
      - build-macos
      - build-windows
      - test-windows-installers
    if: needs.plan-release.outputs.release_required == 'true' && github.repository == 'ericwooley/ssh-man'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan-release.outputs.next_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download app bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ssh-man-app-${{ needs.plan-release.outputs.next_version }}
          path: dist

      - name: Download Windows release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ssh-man-windows-${{ needs.plan-release.outputs.next_version }}
          path: dist

      - name: Restore app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bin
          ditto -x -k dist/ssh-man-app.zip build/bin
          test -x build/bin/ssh-man.app/Contents/MacOS/ssh-man

      - name: Install Developer ID certificate and notarization credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/ssh-man-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ssh-man-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | \
            base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITIES="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
              sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p'
          )"
          IDENTITY_COUNT="$(printf '%s\n' "$IDENTITIES" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$IDENTITY_COUNT" -ne 1 ]; then
            printf 'Expected exactly one Developer ID Application identity, found %s.\n' "$IDENTITY_COUNT" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi

          SIGNING_IDENTITY="$(printf '%s\n' "$IDENTITIES" | awk 'NF { print; exit }')"
          case "$SIGNING_IDENTITY" in
            *"($APPLE_TEAM_ID)") ;;
            *)
              printf 'Developer ID identity does not match Apple Team ID %s: %s\n' \
                "$APPLE_TEAM_ID" "$SIGNING_IDENTITY" >&2
              exit 1
              ;;
          esac

          xcrun notarytool store-credentials ssh-man-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH" \
            --validate

          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          printf 'APPLE_NOTARY_KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf 'APPLE_NOTARY_KEYCHAIN_PROFILE=ssh-man-notary\n' >> "$GITHUB_ENV"

      - name: Sign and notarize release artifact
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bash ./scripts/sign-notarize-darwin-release.sh \
            "$VERSION" \
            build/bin/ssh-man.app \
            dist/ssh-man.dmg

      - name: Publish experimental GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.plan-release.outputs.next_version }}
          name: ssh-man ${{ needs.plan-release.outputs.next_version }} (experimental)
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/ssh-man.dmg
            dist/ssh-man-windows-amd64-installer.exe
            dist/ssh-man-experimental-windows-amd64-installer.exe

      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ericwooley/homebrew-apps
          ref: main
          path: homebrew-apps
          persist-credentials: false

      - name: Calculate release SHA256
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 dist/ssh-man.dmg | awk '{print $1}')"
          printf 'SHA=%s\n' "$SHA" >> "$GITHUB_ENV"

      - name: Update experimental Homebrew cask
        shell: bash
        run: |
          set -euo pipefail
          ruby ./scripts/update-homebrew-cask.rb \
            experimental \
            "$VERSION" \
            "$SHA" \
            homebrew-apps/Casks/ssh-man.rb \
            homebrew-apps/Casks/ssh-man@experimental.rb

      - name: Validate experimental Homebrew cask
        shell: bash
        run: |
          set -euo pipefail
          ruby -c homebrew-apps/Casks/ssh-man@experimental.rb
          grep -F 'binary "#{appdir}/ssh-man.app/Contents/MacOS/ssh-man"' homebrew-apps/Casks/ssh-man@experimental.rb

          TAP_ROOT="$(brew --repository)/Library/Taps/ericwooley"
          TAP_PATH="$TAP_ROOT/homebrew-apps"
          if [ -e "$TAP_PATH" ]; then
            printf 'Unexpected pre-existing Homebrew tap path: %s\n' "$TAP_PATH" >&2
            exit 1
          fi
          mkdir -p "$TAP_ROOT"
          ln -s "$GITHUB_WORKSPACE/homebrew-apps" "$TAP_PATH"
          trap 'rm -f "$TAP_PATH"' EXIT
          HOMEBREW_NO_AUTO_UPDATE=1 brew style --cask ericwooley/apps/ssh-man@experimental
          rm -f "$TAP_PATH"
          trap - EXIT

      - name: Commit tap update
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-apps

          if git diff --quiet -- Casks/ssh-man@experimental.rb &&
            git ls-files --error-unmatch Casks/ssh-man@experimental.rb >/dev/null 2>&1; then
            printf 'Experimental Homebrew cask already up to date.\n'
            exit 0
          fi

          git add Casks/ssh-man@experimental.rb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update experimental ssh-man to ${VERSION}"

      - name: Push tap update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd homebrew-apps

          if git diff --quiet HEAD origin/main; then
            printf 'No Homebrew tap commit to push.\n'
            exit 0
          fi

          gh auth setup-git
          git push origin HEAD:main

      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ssh-man-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ssh-man-developer-id.p12"

  submit-experimental-winget:
    name: Submit experimental WinGet package
    needs:
      - plan-release
      - build-windows
      - publish-release
    if: needs.plan-release.outputs.release_required == 'true' && github.repository == 'ericwooley/ssh-man'
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan-release.outputs.next_version }}

    steps:
      - name: Download WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ssh-man-windows-${{ needs.plan-release.outputs.next_version }}
          path: dist

      - name: Download verified WinGetCreate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolPath = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' `
            -OutFile $toolPath
          $actualSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $toolPath).Hash.ToLowerInvariant()
          $expectedSha = '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea'
          if ($actualSha -ne $expectedSha) {
            throw "WinGetCreate SHA256 mismatch: $actualSha"
          }
          "WINGETCREATE_PATH=$toolPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Submit experimental manifest
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw 'The release environment is missing WINGET_CREATE_GITHUB_TOKEN.'
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'dist\winget\experimental'
          & $env:WINGETCREATE_PATH submit `
            --prtitle "New version: EricWooley.SSHMan.Experimental version $env:VERSION" `
            --no-open `
            $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "WinGetCreate exited with code $LASTEXITCODE."
          }
